<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReachOut OS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand"><span class="mark">R</span><span>ReachOut <span class="muted">OS</span></span></div>
      <nav id="rail-nav" aria-label="Primary">
        <button class="nav-item active" data-page="home" type="button">Home</button>
        <button class="nav-item" data-page="stories" type="button">Stories</button>
        <button class="nav-item" data-page="leads" type="button">Leads</button>
        <button class="nav-item" data-page="review" type="button">Review</button>
        <button class="nav-item" data-page="media" type="button">Media</button>
        <button class="nav-item" data-page="system" type="button">System</button>
      </nav>
      <div class="rail-foot">
        <div class="leader-mini">
          <img id="leader-photo" alt="N. Chandrababu Naidu" hidden>
          <span id="leader-initials" class="initial">CBN</span>
          <span>
            <span class="n">N. Chandrababu Naidu</span><br>
            <span class="r">Andhra Pradesh</span>
          </span>
        </div>
        <div id="standard-tag" class="muted">—</div>
        <div id="env-badge" class="env-badge" hidden>STAGING</div>
        <div id="clock" class="muted">—</div>
      </div>
    </aside>

    <main>
      <div id="page-root" aria-live="polite"></div>
      <footer class="foot">ReachOut OS · Automated reel factory · No publishing actions exist</footer>
    </main>
  </div>
  <div id="lightbox" class="lightbox" hidden><img alt="Full size"><button type="button" class="btn ghost" id="lightbox-close">Close</button></div>
  <script src="/app.js"></script>
</body>
</html>
